name: Secrets Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Segunda 06:00 UTC — pega secrets vazadas em commits ja mergeados
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lista os commits da PR via API; sem isso a scan de
  # pull_request falha com 403 "Resource not accessible by integration".
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE so eh necessario pra repo de organizacao;
          # repo pessoal/publico roda free.
