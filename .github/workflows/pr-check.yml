name: PR Check

# Gate unico do repo. Adaptado do pr-check.yml do monorepo gba.dev, de onde
# este pacote saiu: la o Turbo escolhia o escopo por diff (`--filter=...
# [origin/main]`) porque havia varios pacotes. Aqui ha um so, entao as tasks
# rodam direto — o filtro nao teria o que filtrar.
#
# Tambem ficaram de fora os passos de MCP server e Prisma: sao do monorepo.
#
# E ficou de fora a autenticacao no registry privado, que o workflow de
# origem fazia: este pacote nao consome nenhuma dependencia @gba desde que o
# vinculo com o ai-gateway foi cortado, entao o install resolve tudo no npmjs
# publico. Alem de desnecessario, o passo quebraria PR vinda de fork, onde
# secrets nao existem. Publicar continua exigindo o token — isso esta no
# release.yml, que so roda na main.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O merge-base do commitlint compara com origin/main. Sem isto um fetch
      # raso trunca a historia e o merge-base nao acha ancestral comum.
      - name: Fetch base branch
        run: git fetch origin main

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Detect duplication
        run: pnpm lint:dup

      - name: Detect dead code
        run: pnpm lint:deadcode

      - name: Check bundle size
        run: pnpm size

      - name: Validate API docs
        run: pnpm docs:api:check

      - name: Validate publish artifacts
        run: pnpm validate:publish

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      # Valida so os commits proprios da PR. Usa merge-base: o base.sha da PR
      # pode nao ser ancestral do HEAD quando a main avancou, e
      # `<primeiro-commit>~1` estoura se esse commit for a raiz do repositorio.
      - name: Validate commits
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(git merge-base origin/main "$HEAD_SHA")
          echo "validando $BASE..$HEAD_SHA"
          pnpm commitlint --from "$BASE" --to "$HEAD_SHA"
